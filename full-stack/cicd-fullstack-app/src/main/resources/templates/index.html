<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OpsFlow - CI/CD Pipeline</title>
    <!-- Basic refresh to show "real-time" progress if we want to add htmx later, relying on manual refresh for now -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap');
        :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --text: #f4f4f5; --text-sec: #a1a1aa; --accent: #10b981; --accent-hover: #059669; --radius: 6px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1, h2 { font-weight: 800; color: var(--text); }
        h2 { margin-bottom: 20px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--text-sec); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; transition: 0.2s; outline: none; background: #09090b; color: #fff; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 20px; border-radius: 4px; font-size: 13px; font-weight: 800; cursor: pointer; border: none; width: 100%; transition: 0.2s; background: var(--text); color: var(--bg); text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: var(--accent); color: white; }
        
        .build-list { display: flex; flex-direction: column; gap: 16px; }
        .build-card { border: 1px solid var(--border); border-radius: 6px; padding: 16px; background: rgba(255,255,255,0.02); display: flex; align-items: center; gap: 20px; }
        
        .badge { display: inline-flex; overflow: hidden; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .b-left { background: #3f3f46; padding: 4px 8px; color: white; }
        .b-right { padding: 4px 8px; color: white; }
        .badge.Status-Success .b-right { background: #10b981; }
        .badge.Status-Failed .b-right { background: #ef4444; }
        .badge.Status-Running .b-right { background: #3b82f6; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .repo { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .meta { font-size: 12px; color: var(--text-sec); }
        .commit { color: #f472b6; font-weight: 700; }
        .branch { color: #818cf8; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        
        .controls { display: flex; gap: 8px; margin-left: auto; }
        .btn-sm { font-size: 11px; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border); background: #27272a; color: white; cursor: pointer; font-weight: 700; }
        .btn-sm:hover { background: #3f3f46; }
    </style>
</head>
<body>
    <div style="max-width: 1100px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <div style="color: var(--accent); font-size: 28px;">⚡</div>
            <div>
                <h1 style="margin: 0; font-size: 24px; line-height: 1.2;">OpsFlow</h1>
                <div style="font-size: 12px; color: var(--text-sec); text-transform: uppercase; letter-spacing: 2px;">Deployment Pipeline Console</div>
            </div>
        </div>
        <button onclick="window.location.reload()" class="btn" style="width: auto; background: var(--surface); color: var(--text); border: 1px solid var(--border);">🔄 Refresh</button>
    </div>

    <div class="container">
        <!-- Trigger Build Form -->
        <div class="card" style="height: fit-content;">
            <h2>Trigger New Build</h2>
            <form th:action="@{/trigger}" method="post">
                <div class="form-group">
                    <label>Repository</label>
                    <input type="text" name="repositoryName" value="user/billing-service" required />
                </div>
                <div class="form-group">
                    <label>Target Branch</label>
                    <input type="text" name="branchName" value="main" required />
                </div>
                <div class="form-group">
                    <label>Triggered By</label>
                    <input type="text" name="triggeredBy" value="developer-1" required />
                </div>
                <button type="submit" class="btn">Deploy Now</button>
            </form>
        </div>

        <!-- Builds List -->
        <div class="card" style="padding: 0; border: none; background: transparent; box-shadow: none;">
            <h2 style="margin-bottom: 16px; padding-left: 4px;">Recent CI/CD Runs</h2>
            <div th:if="${builds.empty}" style="background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); padding: 50px; text-align: center; color: var(--text-sec);">No builds executed yet.</div>
            
            <div class="build-list" th:if="${!builds.empty}">
                <div class="build-card" th:each="b : ${builds}">
                    
                    <div th:class="'badge Status-' + ${b.status}" style="width: 100px;">
                        <div class="b-left">Status</div>
                        <div class="b-right" th:text="${b.status}"></div>
                    </div>
                    
                    <div style="flex-grow: 1;">
                        <div class="repo" th:text="${b.repositoryName}"></div>
                        <div class="meta">
                            Triggered by <span th:text="${b.triggeredBy}" style="color: #cbd5e1;"></span> &bull; 
                            <span class="commit" th:text="${b.commitHash}"></span> on  
                            <span class="branch">🔀 <span th:text="${b.branchName}"></span></span>
                        </div>
                        <div style="font-size: 11px; margin-top: 8px; color: #52525b;">
                            Started <span th:text="${#temporals.format(b.startTime, 'HH:mm:ss')}"></span>
                            <span th:if="${b.endTime != null}" th:text="' &bull; Ended ' + ${#temporals.format(b.endTime, 'HH:mm:ss')}"></span>
                        </div>
                    </div>
                    
                    <div class="controls" th:if="${b.status == 'Running'}">
                        <form th:action="@{/update-status/{id}(id=${b.id})}" method="post">
                            <input type="hidden" name="status" value="Success" />
                            <button type="submit" class="btn-sm" style="color: #10b981; border-color: rgba(16,185,129,0.2);">Mark Success</button>
                        </form>
                        <form th:action="@{/update-status/{id}(id=${b.id})}" method="post">
                            <input type="hidden" name="status" value="Failed" />
                            <button type="submit" class="btn-sm" style="color: #ef4444; border-color: rgba(239,68,68,0.2);">Mark Failed</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
