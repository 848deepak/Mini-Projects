<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PayRoll - HR Management</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bg: #f3f4f6; --surface: #ffffff; --border: #e5e7eb; --text: #1f2937; --text-sec: #6b7280; --accent: #059669; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        h1, h2 { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        h2 { margin-bottom: 20px; font-size: 18px; color: var(--accent); }
        .form-group { margin-bottom: 16px; }
        label { display: block; filter: brightness(0.9); font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-sec); text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #d1fae5; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; width: 100%; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #047857; }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; border-radius: 6px; }
        .text-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; font-size: 11px; color: var(--text-sec); text-transform: uppercase; background: #f9fafb; letter-spacing: 0.5px; }
        .money { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; letter-spacing: 0.5px; }
        
        .progress-bar-container { width: 100%; background: #e5e7eb; border-radius: 4px; height: 8px; overflow: hidden; margin-top: 6px; }
        .progress-bar { background: var(--accent); height: 100%; transition: width 0.3s ease; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto 30px; display: flex; align-items: center; gap: 10px;">
        <div style="background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;">💵</div>
        <h1 style="margin: 0; font-size: 24px;">HR PayRoll <span style="font-size: 14px; color: var(--text-sec); font-weight: 500; font-family: 'Inter'; text-transform: none; letter-spacing: normal;">Attendance & Salary</span></h1>
    </div>

    <div class="container">
        <!-- Add Employee -->
        <div class="card" style="height: fit-content;">
            <h2>Register Employee</h2>
            <form th:action="@{/add}" th:object="${newEmployee}" method="post">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{name}" placeholder="John Doe" />
                    <span class="text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" th:field="*{role}" placeholder="Software Engineer" />
                    <span class="text-error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
                </div>
                <div class="form-group">
                    <label>Base Monthly Salary ($)</label>
                    <input type="number" th:field="*{baseSalary}" placeholder="5000" />
                    <span class="text-error" th:if="${#fields.hasErrors('baseSalary')}" th:errors="*{baseSalary}"></span>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Add Employee</button>
            </form>
        </div>

        <!-- Payroll Table -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 0;"><h2>Current Month Roster (22 Working Days)</h2></div>
            <div th:if="${employees.empty}" style="padding: 40px; text-align: center; color: var(--text-sec);">No employees registered yet.</div>
            <table th:if="${!employees.empty}">
                <thead><tr><th>Employee Details</th><th>Base Salary</th><th>Attendance</th><th>Calculated Pay</th><th>Action</th></tr></thead>
                <tbody>
                    <tr th:each="e : ${employees}">
                        <td>
                            <div th:text="${e.name}" style="font-weight: 600;"></div>
                            <div th:text="${e.role}" style="font-size: 11px; color: var(--text-sec);"></div>
                        </td>
                        <td th:text="'$' + ${#numbers.formatDecimal(e.baseSalary, 1, 2)}" class="money" style="color: var(--text-sec);"></td>
                        <td style="width: 200px;">
                            <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--accent);">
                                <span th:text="${e.presentDays} + ' / ' + ${e.workingDays} + ' Days'"></span>
                                <span th:text="${#numbers.formatDecimal((e.presentDays * 100.0) / e.workingDays, 1, 0)} + '%'"></span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar" th:style="'width: ' + ${(e.presentDays * 100.0) / e.workingDays} + '%'"></div>
                            </div>
                        </td>
                        <td class="money" style="font-size: 16px; color: var(--accent);" th:text="'$' + ${#numbers.formatDecimal(e.calculatedSalary, 1, 2)}"></td>
                        <td>
                            <form th:action="@{/mark-present/{id}(id=${e.id})}" method="post" th:if="${e.presentDays < e.workingDays}">
                                <button type="submit" class="btn btn-sm" style="background:#d1fae5; color:#065f46;">Mark Present</button>
                            </form>
                            <span th:if="${e.presentDays >= e.workingDays}" style="font-size: 11px; font-weight: 600; color: #166534; background: #dcfce7; padding: 4px 8px; border-radius: 4px;">Max Days</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
