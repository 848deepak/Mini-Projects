<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AutoCare - Vehicle Service Booking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-sec: #64748b; --accent: #2563eb; --accent-light: #dbeafe; --success: #16a34a; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border); }
        h1, h2 { font-weight: 700; margin-bottom: 20px; color: var(--text); }
        .form-group { margin-bottom: 16px; }
        label { display: block; filter: brightness(0.9); font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sec); }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; transition: border-color 150ms; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 150ms; width: 100%; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; border-radius: 6px; }
        .text-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f1f5f9; font-weight: 600; font-size: 12px; color: var(--text-sec); text-transform: uppercase; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.Pending { background: #fef3c7; color: #92400e; }
        .badge.In-Progress { background: #dbeafe; color: #1e40af; }
        .badge.Completed { background: #dcfce7; color: #166534; }
        .empty { text-align: center; padding: 40px; color: var(--text-sec); font-size: 14px; }
        .flex-actions { display: flex; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto 30px; display: flex; align-items: center; gap: 10px;">
        <div style="background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;">🚗</div>
        <h1 style="margin: 0;">AutoCare <span style="font-size: 16px; color: var(--text-sec); font-weight: 500;">Service Booking</span></h1>
    </div>

    <div class="container">
        <!-- Booking Form -->
        <div class="card">
            <h2>New Booking</h2>
            <form th:action="@{/book}" th:object="${newBooking}" method="post">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" th:field="*{customerName}" placeholder="John Doe" />
                    <span class="text-error" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}">Error</span>
                </div>
                <div class="form-group">
                    <label>Vehicle Number</label>
                    <input type="text" th:field="*{vehicleNumber}" placeholder="MH 01 AB 1234" />
                    <span class="text-error" th:if="${#fields.hasErrors('vehicleNumber')}" th:errors="*{vehicleNumber}">Error</span>
                </div>
                <div class="form-group">
                    <label>Service Type</label>
                    <select th:field="*{serviceType}">
                        <option value="General Service">General Service (Oil, Filters)</option>
                        <option value="Washing & Detailing">Washing & Detailing</option>
                        <option value="Dent & Paint">Dent & Paint</option>
                        <option value="Engine Repair">Engine Repair</option>
                        <option value="Tyres & Wheels">Tyres & Wheels</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" th:field="*{serviceDate}" />
                    <span class="text-error" th:if="${#fields.hasErrors('serviceDate')}" th:errors="*{serviceDate}">Error</span>
                </div>
                <button type="submit" class="btn btn-primary">Book Appointment</button>
            </form>
        </div>

        <!-- Bookings List -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 0;"><h2>Active Appointments</h2></div>
            <div th:if="${bookings.empty}" class="empty">
                No appointments booked yet.
            </div>
            <table th:if="${!bookings.empty}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Vehicle</th>
                        <th>Service Type</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${bookings}">
                        <td th:text="'#' + ${b.id}"></td>
                        <td th:text="${b.customerName}" style="font-weight: 600;"></td>
                        <td th:text="${b.vehicleNumber}"></td>
                        <td th:text="${b.serviceType}"></td>
                        <td th:text="${b.serviceDate}"></td>
                        <td><span th:text="${b.status}" th:class="'badge ' + ${b.status}"></span></td>
                        <td class="flex-actions">
                            <form th:action="@{/update-status/{id}(id=${b.id})}" method="post" th:if="${b.status == 'Pending'}">
                                <input type="hidden" name="status" value="In-Progress" />
                                <button type="submit" class="btn btn-sm" style="background:#f1f5f9; color:#1e40af;">Start</button>
                            </form>
                            <form th:action="@{/update-status/{id}(id=${b.id})}" method="post" th:if="${b.status == 'In-Progress'}">
                                <input type="hidden" name="status" value="Completed" />
                                <button type="submit" class="btn btn-sm" style="background:#dcfce7; color:#166534;">Finish</button>
                            </form>
                            <form th:action="@{/delete/{id}(id=${b.id})}" method="post">
                                <button type="submit" class="btn btn-sm" style="background:#fee2e2; color:#dc2626;" onclick="return confirm('Are you sure?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
