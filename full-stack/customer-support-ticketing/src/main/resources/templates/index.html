<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SupportDesk - Support Ticketing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        :root { --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-sec: #64748b; --accent: #4f46e5; --accent-light: #e0e7ff; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid var(--border); }
        h1, h2 { font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sec); }
        input, select, textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; background: var(--accent); color: white; }
        .btn:hover { filter: brightness(1.1); }
        .text-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: #f1f5f9; font-weight: 600; font-size: 12px; color: var(--text-sec); text-transform: uppercase; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-High { background: #fee2e2; color: #991b1b; }
        .badge-Medium { background: #fef3c7; color: #92400e; }
        .badge-Low { background: #f1f5f9; color: #475569; }

        .status-Open { background: #fee2e2; color: #b91c1c; }
        .status-In-Progress { background: #dbeafe; color: #1d4ed8; }
        .status-Resolved { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>
    <div style="max-width: 1300px; margin: 0 auto 30px; display: flex; align-items: center; gap: 10px;">
        <div style="background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;">🎧</div>
        <h1 style="margin: 0;">SupportDesk</h1>
    </div>

    <div class="container">
        <!-- New Ticket Form -->
        <div class="card" style="height: fit-content;">
            <h2>Submit a Ticket</h2>
            <form th:action="@{/submit}" th:object="${newTicket}" method="post">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" th:field="*{customerName}" required />
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}" required />
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" th:field="*{subject}" required />
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select th:field="*{priority}">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}" required></textarea>
                </div>
                <button type="submit" class="btn">Create Ticket</button>
            </form>
        </div>

        <!-- Tickets List -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 0;"><h2>Support Queue</h2></div>
            <div th:if="${tickets.empty}" style="padding: 40px; text-align: center; color: var(--text-sec);">No tickets in queue. Great job!</div>
            <table th:if="${!tickets.empty}">
                <thead><tr><th>Ticket Details</th><th>Customer</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                    <tr th:each="t : ${tickets}">
                        <td>
                            <div style="font-weight: 600; color: var(--accent);" th:text="'#' + ${t.id} + ' ' + ${t.subject}"></div>
                            <div style="font-size: 13px; color: var(--text-sec); margin-top: 4px;" th:text="${t.description}"></div>
                        </td>
                        <td>
                            <div th:text="${t.customerName}" style="font-weight: 500;"></div>
                            <div th:text="${t.email}" style="font-size: 11px; color: var(--text-sec);"></div>
                        </td>
                        <td><span th:text="${t.priority}" th:class="'badge badge-' + ${t.priority}"></span></td>
                        <td><span th:text="${t.status}" th:class="'badge status-' + ${#strings.replace(t.status, ' ', '-')}"></span></td>
                        <td>
                            <form th:action="@{/update-status/{id}(id=${t.id})}" method="post">
                                <select name="status" onchange="this.form.submit()" style="padding: 4px; font-size: 11px; font-weight: 600; background: #f8fafc;">
                                    <option value="" disabled selected>Update...</option>
                                    <option value="Open">Open</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Resolved">Resolved</option>
                                </select>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
