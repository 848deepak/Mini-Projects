<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IT Inventory - Asset Management</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bg: #f0fdfa; --surface: #ffffff; --border: #ccfbf1; --text: #0f172a; --text-sec: #475569; --accent: #0f766e; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 15px rgba(15, 118, 110, 0.05); border: 1px solid var(--border); }
        h1, h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--accent); }
        h2 { margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sec); }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #fff; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #99f6e4; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; font-family: 'Space Grotesk', sans-serif; transition: 0.2s; background: var(--accent); color: white; }
        .btn:hover { background: #115e59; }
        .text-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { font-weight: 600; font-size: 12px; color: var(--text-sec); text-transform: uppercase; background: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; font-family: 'Space Grotesk', sans-serif; }
        .badge-Available { background: #dcfce7; color: #166534; }
        .badge-Assigned { background: #dbeafe; color: #1e40af; }
        .badge-Repair { background: #fef9c3; color: #854d0e; }
        .badge-Retired { background: #f1f5f9; color: #475569; }

        .update-form { display: flex; gap: 8px; align-items: center; }
        .update-form select, .update-form input { padding: 6px 10px; font-size: 12px; width: 130px; }
        .btn-sm { padding: 6px 12px; background: #f1f5f9; color: var(--accent); font-family: 'Inter'; font-size: 12px; width: auto; border: 1px solid var(--border); }
        .btn-sm:hover { background: #e2e8f0; color: #0f172a; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto 30px; display: flex; align-items: center; gap: 12px;">
        <div style="background: var(--accent); color: white; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px;">💻</div>
        <h1 style="margin: 0; font-size: 26px;">IT Asset Hub</h1>
    </div>

    <div class="container">
        <!-- New Asset -->
        <div class="card" style="height: fit-content;">
            <h2>Register Asset</h2>
            <form th:action="@{/add}" th:object="${newAsset}" method="post">
                <div class="form-group">
                    <label>Asset Model / Name</label>
                    <input type="text" th:field="*{name}" placeholder="MacBook Pro M2" required />
                </div>
                <div class="form-group">
                    <label>Serial Number</label>
                    <input type="text" th:field="*{serialNumber}" placeholder="SN-123456" required />
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select th:field="*{type}">
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Phone">Phone</option>
                        <option value="Software">Software License</option>
                        <option value="Accessory">Accessory</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Initial Status</label>
                    <select th:field="*{status}" onchange="document.getElementById('assignInput').style.display = this.value === 'Assigned' ? 'block' : 'none'">
                        <option value="Available">Available in Inventory</option>
                        <option value="Assigned">Assigned to Employee</option>
                    </select>
                </div>
                <div class="form-group" id="assignInput" style="display: none;">
                    <label>Assign To</label>
                    <input type="text" th:field="*{assignedTo}" placeholder="Employee Name" />
                </div>
                <button type="submit" class="btn">Add to Inventory</button>
            </form>
        </div>

        <!-- Inventory List -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 0;"><h2>Asset Inventory</h2></div>
            <div th:if="${assets.empty}" style="padding: 50px; text-align: center; color: var(--text-sec);">No assets found in inventory.</div>
            <table th:if="${!assets.empty}">
                <thead><tr><th>Asset Details</th><th>Type / SN</th><th>Status & Assignment</th><th>Update Status</th></tr></thead>
                <tbody>
                    <tr th:each="a : ${assets}">
                        <td>
                            <div style="font-weight: 600;" th:text="${a.name}"></div>
                            <div style="font-size: 11px; color: var(--text-sec);" th:text="'Added ' + ${a.dateAdded}"></div>
                        </td>
                        <td>
                            <div style="font-weight: 500;" th:text="${a.type}"></div>
                            <div style="font-family: monospace; font-size: 11px; color: var(--text-sec);" th:text="${a.serialNumber}"></div>
                        </td>
                        <td>
                            <div style="margin-bottom: 4px;"><span th:text="${a.status}" th:class="'badge badge-' + ${#strings.replace(a.status, ' ', '')}"></span></div>
                            <div th:if="${a.status == 'Assigned'}" style="font-size: 12px; font-weight: 500;">👤 <span th:text="${a.assignedTo}"></span></div>
                        </td>
                        <td>
                            <form th:action="@{/update}" method="post" class="update-form">
                                <input type="hidden" name="id" th:value="${a.id}" />
                                <div style="display: flex; flex-direction: column; gap: 4px;">
                                    <select name="status" onchange="this.nextElementSibling.style.display = this.value === 'Assigned' ? 'block' : 'none'">
                                        <option value="Available" th:selected="${a.status == 'Available'}">Available</option>
                                        <option value="Assigned" th:selected="${a.status == 'Assigned'}">Assigned</option>
                                        <option value="Under Repair" th:selected="${a.status == 'Under Repair'}">Under Repair</option>
                                        <option value="Retired" th:selected="${a.status == 'Retired'}">Retired</option>
                                    </select>
                                    <input type="text" name="assignedTo" placeholder="Employee Name" th:value="${a.assignedTo}" th:style="${a.status == 'Assigned' ? 'display:block;' : 'display:none;'}" />
                                </div>
                                <button type="submit" class="btn btn-sm">Save</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
