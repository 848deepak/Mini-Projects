<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Portal — Login</title>
  <meta name="description" content="Smart Role-Based College Management Portal — Admin, Faculty, and Student dashboards">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>🎓 College Portal</h1>
      <p>Chandigarh University Management System</p>

      <div class="role-tabs">
        <button class="role-tab active" data-role="admin">Admin</button>
        <button class="role-tab" data-role="faculty">Faculty</button>
        <button class="role-tab" data-role="student">Student</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>User ID</label>
          <input type="text" id="userId" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn" data-role="admin">Login as Admin</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-hint">
        <strong>Demo Credentials:</strong><br>
        Admin: <code>admin / admin123</code><br>
        Faculty: <code>fac001 / pass</code><br>
        Student: <code>stu001 / pass</code>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="auth.js"></script>
</body>
</html>
