<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker — Personal Finance</title>
  <meta name="description" content="Digital Expense Tracker with budgets, charts, and CSV export">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn btn-primary" id="addBtn" onclick="toggleAddPanel()">+ Add Transaction</button>
      </div>
    </header>

    <!-- Add Transaction Panel -->
    <div class="add-panel" id="addPanel">
      <div class="add-panel-inner">
        <h3>New Transaction</h3>
        <form id="txForm" onsubmit="addTransaction(event)">
          <div class="form-row">
            <div class="form-group">
              <label>Type</label>
              <div class="type-toggle">
                <button type="button" class="type-btn active" data-type="expense" onclick="setType('expense')">Expense</button>
                <button type="button" class="type-btn" data-type="income" onclick="setType('income')">Income</button>
              </div>
            </div>
            <div class="form-group">
              <label>Amount (₹)</label>
              <input type="number" id="txAmount" min="1" required placeholder="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Category</label>
              <select id="txCategory" required></select>
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="txDate" required>
            </div>
          </div>
          <div class="form-group">
            <label>Note (optional)</label>
            <input type="text" id="txNote" placeholder="What was this for?">
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="toggleAddPanel()">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Transaction</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard-grid">
      <div class="summary-card income-card">
        <div class="summary-icon">📈</div>
        <div class="summary-value" id="totalIncome">₹0</div>
        <div class="summary-label">Income</div>
      </div>
      <div class="summary-card expense-card">
        <div class="summary-icon">📉</div>
        <div class="summary-value" id="totalExpense">₹0</div>
        <div class="summary-label">Expenses</div>
      </div>
      <div class="summary-card balance-card">
        <div class="summary-icon">💎</div>
        <div class="summary-value" id="balance">₹0</div>
        <div class="summary-label">Balance</div>
      </div>
    </div>

    <!-- Charts + Budget -->
    <div class="charts-section">
      <div class="chart-card">
        <h3>Spending by Category</h3>
        <div class="chart-container"><canvas id="donutChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Monthly Trend (Last 6 Months)</h3>
        <div class="chart-container"><canvas id="lineChart"></canvas></div>
      </div>
    </div>

    <!-- Budget Section -->
    <div class="section-card" id="budgetSection">
      <h3>Monthly Budgets <button class="btn btn-outline btn-sm" onclick="showBudgetModal()">⚙ Set Budgets</button></h3>
      <div class="budget-bars" id="budgetBars"></div>
    </div>

    <!-- Filters -->
    <div class="section-card">
      <div class="filter-bar">
        <h3>Transactions</h3>
        <div class="filters">
          <select id="filterCategory" onchange="renderTransactions()">
            <option value="all">All Categories</option>
          </select>
          <input type="month" id="filterMonth" onchange="renderTransactions()">
        </div>
      </div>
      <div id="transactionList"></div>
    </div>
  </div>

  <!-- Budget Modal -->
  <div class="modal-overlay" id="budgetModal">
    <div class="modal">
      <h3>Set Monthly Budgets</h3>
      <div id="budgetForm"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeBudgetModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveBudgets()">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="transactions.js"></script>
  <script src="dashboard.js"></script>
  <script src="charts.js"></script>
</body>
</html>
