<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EventHub - Easy Registration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root { --bg: #f5f3ff; --surface: #ffffff; --border: #ede9fe; --text: #1e1b4b; --text-sec: #6d28d9; --accent: #8b5cf6; --accent-light: #ddd6fe; --success: #10b981; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.1); }
        h1, h2 { font-weight: 700; color: var(--text); }
        h2 { margin-bottom: 20px; font-size: 1.25rem; color: var(--accent); }
        .form-group { margin-bottom: 15px; }
        label { display: block; filter: brightness(0.9); font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text-sec); }
        input, select { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 14px; transition: 0.2s; outline: none; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; transition: 0.2s; background: var(--accent); color: white; }
        .btn:hover { background: #7c3aed; transform: translateY(-1px); }
        .text-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; font-size: 12px; color: var(--text-sec); text-transform: uppercase; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge.bg-vip { background: #fef08a; color: #854d0e; }
        .badge.bg-reg { background: #f1f5f9; color: #475569; }
        .status-check { color: var(--success); font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto 30px; display: flex; align-items: center; gap: 10px;">
        <div style="background: var(--accent); color: white; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;">🎟️</div>
        <h1 style="margin: 0; font-size: 24px;">EventHub <span style="font-size: 14px; color: var(--text-sec); font-weight: 500;">Registration System</span></h1>
    </div>

    <div class="container">
        <div class="card">
            <h2>Register for Event</h2>
            <form th:action="@{/register}" th:object="${newReg}" method="post">
                <div class="form-group">
                    <label>Attendee Name</label>
                    <input type="text" th:field="*{attendeeName}" placeholder="John Doe" />
                    <span class="text-error" th:if="${#fields.hasErrors('attendeeName')}" th:errors="*{attendeeName}"></span>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" th:field="*{email}" placeholder="john@example.com" />
                    <span class="text-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="form-group">
                    <label>Select Event</label>
                    <select th:field="*{eventName}">
                        <option value="Tech Conference 2026">Tech Conference 2026</option>
                        <option value="Design Summit">Design Summit</option>
                        <option value="AI Workshop">AI Workshop</option>
                        <option value="Startup Pitch Day">Startup Pitch Day</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Ticket Type</label>
                    <select th:field="*{ticketType}">
                        <option value="Regular">Regular Pass</option>
                        <option value="VIP">VIP Pass</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="margin-top: 10px;">Register Now</button>
            </form>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 0;"><h2>Attendees List</h2></div>
            <div th:if="${registrations.empty}" style="padding: 40px; text-align: center; color: var(--text-sec);">No attendees registered yet.</div>
            <table th:if="${!registrations.empty}">
                <thead><tr><th>Attendee</th><th>Event</th><th>Ticket</th><th>Checked In</th><th>Action</th></tr></thead>
                <tbody>
                    <tr th:each="r : ${registrations}">
                        <td>
                            <div th:text="${r.attendeeName}" style="font-weight: 600;"></div>
                            <div th:text="${r.email}" style="font-size: 11px; color: var(--text-sec);"></div>
                        </td>
                        <td th:text="${r.eventName}"></td>
                        <td><span th:text="${r.ticketType}" th:class="${r.ticketType == 'VIP' ? 'badge bg-vip' : 'badge bg-reg'}"></span></td>
                        <td style="text-align: center;">
                            <span th:if="${r.checkedIn}" class="status-check">✓</span>
                            <span th:if="${!r.checkedIn}" style="color: #cbd5e1;">-</span>
                        </td>
                        <td>
                            <form th:action="@{/checkin/{id}(id=${r.id})}" method="post" th:if="${!r.checkedIn}">
                                <button type="submit" class="btn" style="padding: 4px 10px; font-size: 11px; width: auto; background: var(--success);">Check In</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
