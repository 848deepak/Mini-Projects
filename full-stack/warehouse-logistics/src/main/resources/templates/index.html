<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LogisVault - Warehouse Management</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bg: #f8fafc; --surface: #ffffff; --border: #cbd5e1; --text: #0f172a; --text-sec: #475569; --accent: #f59e0b; --accent-dark: #d97706; --radius: 8px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1250px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 2px solid var(--border); }
        h1, h2 { font-family: 'Chakra Petch', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        h2 { margin-bottom: 20px; font-size: 18px; color: var(--text); border-bottom: 3px solid var(--accent); display: inline-block; padding-bottom: 4px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-sec); text-transform: uppercase; }
        input, select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 6px; font-size: 14px; transition: 0.2s; outline: none; background: #fff; font-weight: 500; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; width: 100%; transition: 0.2s; background: var(--accent); color: #fff; font-family: 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: var(--accent-dark); filter: brightness(0.95); }
        .text-error { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { font-weight: 700; font-size: 12px; color: var(--text-sec); text-transform: uppercase; background: #f1f5f9; font-family: 'Chakra Petch', sans-serif; }
        
        .sku { font-family: monospace; font-size: 13px; font-weight: 700; color: var(--accent-dark); background: #fef3c7; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-block; text-transform: uppercase; font-family: 'Chakra Petch', sans-serif; }
        .badge-InStock { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-LowStock { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .badge-OutofStock { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        .qty-control { display: flex; align-items: center; gap: 8px; }
        .qty-val { font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 18px; width: 40px; text-align: center; }
        .btn-icon { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: bold; color: var(--text); }
        .btn-icon:hover { background: #f1f5f9; }
    </style>
</head>
<body>
    <div style="max-width: 1250px; margin: 0 auto 30px; display: flex; align-items: center; gap: 12px;">
        <div style="background: var(--text); color: var(--accent); width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid var(--accent);">📦</div>
        <div>
            <h1 style="margin: 0; font-size: 28px; line-height: 1;">LogisVault</h1>
            <div style="font-size: 12px; font-weight: 700; color: var(--text-sec); letter-spacing: 2px; text-transform: uppercase; font-family: 'Chakra Petch';">Warehouse Control System</div>
        </div>
    </div>

    <div class="container">
        <!-- Add Inventory -->
        <div class="card" style="height: fit-content;">
            <h2>Receive Stock</h2>
            <form th:action="@{/add}" th:object="${newItem}" method="post">
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" th:field="*{name}" placeholder="Wireless Keyboard" required />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select th:field="*{category}">
                        <option value="Electronics">Electronics</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Hardware">Hardware Parts</option>
                        <option value="Raw Materials">Raw Materials</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Initial Quantity</label>
                    <input type="number" min="0" th:field="*{quantity}" placeholder="0" />
                </div>
                <div class="form-group">
                    <label>Aisle Location</label>
                    <input type="text" th:field="*{aisle}" placeholder="A1-Rack-05" />
                </div>
                <button type="submit" class="btn" style="margin-top: 10px;">Register Item</button>
            </form>
        </div>

        <!-- Inventory List -->
        <div class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 0;"><h2>Master Inventory</h2></div>
            <div th:if="${items.empty}" style="padding: 50px; text-align: center; color: var(--text-sec); font-weight: 500;">Warehouse is empty. No stock data.</div>
            <table th:if="${!items.empty}">
                <thead><tr><th>SKU & Item Name</th><th>Category / Aisle</th><th>Status</th><th>Quantity Control</th></tr></thead>
                <tbody>
                    <tr th:each="i : ${items}">
                        <td>
                            <div class="sku" th:text="${i.sku}"></div>
                            <div style="font-weight: 600; font-size: 15px;" th:text="${i.name}"></div>
                        </td>
                        <td>
                            <div style="font-weight: 600; margin-bottom: 4px;" th:text="${i.category}"></div>
                            <div style="font-size: 12px; color: var(--text-sec); font-family: monospace;" th:text="'📍 ' + ${i.aisle}"></div>
                        </td>
                        <td><span th:text="${i.status}" th:class="'badge badge-' + ${#strings.replace(i.status, ' ', '')}"></span></td>
                        <td>
                            <div class="qty-control">
                                <form th:action="@{/stock/{id}(id=${i.id})}" method="post">
                                    <input type="hidden" name="adjustment" value="-1" />
                                    <button type="submit" class="btn-icon" th:disabled="${i.quantity == 0}" th:style="${i.quantity == 0 ? 'opacity:0.5;cursor:not-allowed;' : ''}">-</button>
                                </form>
                                <span class="qty-val" th:text="${i.quantity}"></span>
                                <form th:action="@{/stock/{id}(id=${i.id})}" method="post">
                                    <input type="hidden" name="adjustment" value="1" />
                                    <button type="submit" class="btn-icon">+</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
