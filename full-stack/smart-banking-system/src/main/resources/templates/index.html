<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NeoBank - Smart Banking</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        :root { --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f8fafc; --text-sec: #94a3b8; --accent: #38bdf8; --radius: 16px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 40px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--border); }
        h1, h2 { font-weight: 800; }
        h2 { margin-bottom: 24px; font-size: 20px; color: var(--text); }
        .form-group { margin-bottom: 16px; }
        label { display: block; filter: brightness(0.9); font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background: #0f172a; color: white; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; width: 100%; transition: 0.2s; background: var(--accent); color: #0f172a; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #bae6fd; transform: translateY(-1px); }
        .btn-sm { padding: 8px 12px; font-size: 12px; width: auto; border-radius: 6px; }
        .text-error { color: #f87171; font-size: 12px; margin-top: 4px; display: block; }
        
        .account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .account-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid var(--border); border-radius: 12px; padding: 24px; position: relative; overflow: hidden; }
        .account-card::after { content: ''; position: absolute; top: 0; right: 0; width: 150px; height: 150px; background: rgba(56, 189, 248, 0.05); border-radius: 50%; transform: translate(50%, -50%); }
        
        .bank-logo { font-size: 24px; margin-bottom: 12px; }
        .balance { font-size: 32px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .account-no { font-family: monospace; font-size: 14px; color: var(--accent); letter-spacing: 2px; margin-bottom: 24px; }
        .holder-name { font-size: 14px; font-weight: 600; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; }
        
        .tx-form { display: flex; gap: 8px; margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
        .tx-form select, .tx-form input { padding: 8px; font-size: 12px; border-radius: 6px; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto 30px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background: var(--accent); color: #0f172a; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;">N</div>
            <h1 style="margin: 0; font-size: 28px; letter-spacing: -0.5px;">NeoBank</h1>
        </div>
    </div>

    <div class="container">
        <!-- New Account Form -->
        <div class="card" style="height: fit-content;">
            <h2>Open Account</h2>
            <form th:action="@{/create}" th:object="${newAccount}" method="post">
                <div class="form-group">
                    <label>Account Holder Name</label>
                    <input type="text" th:field="*{holderName}" placeholder="Alex Mercer" />
                    <span class="text-error" th:if="${#fields.hasErrors('holderName')}" th:errors="*{holderName}"></span>
                </div>
                <div class="form-group">
                    <label>Initial Deposit ($)</label>
                    <input type="number" step="0.01" th:field="*{balance}" placeholder="0.00" />
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
        </div>

        <!-- Accounts Viewer -->
        <div>
            <h2 style="margin-left: 8px; color: var(--text-sec);">Registered Accounts</h2>
            <div th:if="${accounts.empty}" class="card" style="text-align: center; color: var(--text-sec); padding: 40px;">No active accounts yet.</div>
            
            <div class="account-grid" th:if="${!accounts.empty}">
                <div class="account-card" th:each="a : ${accounts}">
                    <div class="bank-logo">💰</div>
                    <div class="balance" th:text="'$' + ${#numbers.formatDecimal(a.balance, 1, 'COMMA', 2, 'POINT')}"></div>
                    <div class="account-no" th:text="${a.accountNumber}"></div>
                    <div class="holder-name" th:text="${a.holderName}"></div>

                    <form class="tx-form" th:action="@{/transaction/{id}(id=${a.id})}" method="post">
                        <select name="type">
                            <option value="Deposit">Deposit</option>
                            <option value="Withdraw">Withdraw</option>
                        </select>
                        <input type="number" name="amount" min="1" step="0.01" placeholder="Amount" required style="width: 100px;" />
                        <button type="submit" class="btn btn-sm">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
