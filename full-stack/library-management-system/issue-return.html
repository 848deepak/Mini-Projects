<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Issue / Return</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">📚 Library<span>MS</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Catalog</a>
        <a href="issue-return.html" class="nav-link active">Issue / Return</a>
        <a href="members.html" class="nav-link">Members</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- Issue Book -->
    <div class="section-card">
      <h3>📗 Issue a Book</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Book (ISBN or Title)</label>
          <select id="issueBook" class="input"></select>
        </div>
        <div class="form-group">
          <label>Member</label>
          <select id="issueMember" class="input"></select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="handleIssue()">Issue Book</button>
    </div>

    <!-- Return Book -->
    <div class="section-card">
      <h3>📕 Return a Book</h3>
      <p style="font-size:13px;color:var(--text-sec);margin-bottom:14px;">Select an active issue to return</p>
      <table>
        <thead><tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="activeIssues"></tbody>
      </table>
    </div>

    <!-- Transaction History -->
    <div class="section-card">
      <h3>📋 Transaction History</h3>
      <table>
        <thead><tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Returned</th><th>Fine</th></tr></thead>
        <tbody id="txHistory"></tbody>
      </table>
    </div>
  </main>

  <!-- Fine Modal -->
  <div class="modal-overlay" id="fineModal">
    <div class="modal" style="text-align:center;">
      <h3>📕 Book Returned</h3>
      <div id="fineDetails"></div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-primary" onclick="document.getElementById('fineModal').classList.remove('active');renderAll();">OK</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="library.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initLibraryData();
      populateDropdowns();
      renderAll();
    });

    function populateDropdowns() {
      const books = getBooks().filter(b => b.copies_available > 0);
      document.getElementById('issueBook').innerHTML = books.map(b =>
        `<option value="${b.isbn}">${b.title} (${b.copies_available} avail)</option>`
      ).join('');

      const members = getMembers();
      document.getElementById('issueMember').innerHTML = members.map(m =>
        `<option value="${m.id}">${m.name} (${m.id})</option>`
      ).join('');
    }

    function handleIssue() {
      const isbn = document.getElementById('issueBook').value;
      const memberId = document.getElementById('issueMember').value;
      if (issueBook(isbn, memberId)) {
        populateDropdowns();
        renderAll();
      }
    }

    function handleReturn(txId) {
      const fine = returnBook(txId);
      if (fine !== null) {
        const modal = document.getElementById('fineModal');
        document.getElementById('fineDetails').innerHTML = fine > 0
          ? `<p style="font-size:18px;margin:16px 0;">Fine: <span class="fine">₹${fine}</span></p><p style="font-size:13px;color:var(--text-sec);">Overdue by ${fine / 2} day(s) at ₹2/day</p>`
          : `<p style="font-size:16px;margin:16px 0;color:var(--success);">✓ Returned on time — No fine!</p>`;
        modal.classList.add('active');
        populateDropdowns();
      }
    }

    function renderAll() {
      renderActiveIssues();
      renderHistory();
    }

    function renderActiveIssues() {
      const txs = getTransactions_().filter(t => !t.returned_at);
      const books = getBooks();
      const members = getMembers();
      const today = new Date().toISOString().split('T')[0];

      document.getElementById('activeIssues').innerHTML = txs.length === 0
        ? '<tr><td colspan="6" class="empty-state">No active issues</td></tr>'
        : txs.map(t => {
            const book = books.find(b => b.isbn === t.book_isbn);
            const member = members.find(m => m.id === t.member_id);
            const isOverdue = t.due_date < today;
            return `
              <tr class="${isOverdue ? 'overdue-row' : ''}">
                <td>${book ? book.title : t.book_isbn}</td>
                <td>${member ? member.name : t.member_id}</td>
                <td>${t.issued_at}</td>
                <td>${t.due_date}</td>
                <td>${isOverdue ? '<span class="badge badge-issued">Overdue</span>' : '<span class="badge badge-available">Active</span>'}</td>
                <td><button class="btn btn-success btn-sm" onclick="handleReturn(${t.id})">Return</button></td>
              </tr>
            `;
          }).join('');
    }

    function renderHistory() {
      const txs = getTransactions_().filter(t => t.returned_at).sort((a, b) => new Date(b.returned_at) - new Date(a.returned_at));
      const books = getBooks();
      const members = getMembers();

      document.getElementById('txHistory').innerHTML = txs.length === 0
        ? '<tr><td colspan="6" class="empty-state">No completed transactions</td></tr>'
        : txs.map(t => {
            const book = books.find(b => b.isbn === t.book_isbn);
            const member = members.find(m => m.id === t.member_id);
            const fine = calculateFine(t.due_date, t.returned_at);
            return `
              <tr>
                <td>${book ? book.title : t.book_isbn}</td>
                <td>${member ? member.name : t.member_id}</td>
                <td>${t.issued_at}</td>
                <td>${t.due_date}</td>
                <td>${t.returned_at}</td>
                <td>${fine > 0 ? `<span class="fine">₹${fine}</span>` : '<span style="color:var(--success)">—</span>'}</td>
              </tr>
            `;
          }).join('');
    }
  </script>
</body>
</html>
