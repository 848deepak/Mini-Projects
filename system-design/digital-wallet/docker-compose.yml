version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: digital-wallet-mysql
    environment:
      MYSQL_DATABASE: digital_wallet
      MYSQL_USER: wallet
      MYSQL_PASSWORD: wallet
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digital-wallet-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: digital-wallet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
