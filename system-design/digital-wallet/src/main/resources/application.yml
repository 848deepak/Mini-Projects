spring:
  application:
    name: digital-wallet
  datasource:
    url: jdbc:mysql://localhost:3306/digital_wallet?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: wallet
    password: wallet
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

wallet:
  notifications:
    exchange: wallet.events
    routing-key: wallet.transaction.created
